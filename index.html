<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>露營裝備盤點</title>
  <style>
    :root{--green:#285943;--light:#f3f7f2;--line:#d9e3d8;--accent:#d9772a;--text:#26352b}
    *{box-sizing:border-box}body{margin:0;background:var(--light);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Microsoft JhengHei",sans-serif}
    header{background:var(--green);color:#fff;padding:28px max(20px,calc((100% - 1180px)/2))}
    header h1{margin:0 0 4px;font-size:clamp(24px,4vw,36px)}header p{margin:0;opacity:.86}
    main{max-width:1180px;margin:24px auto;padding:0 20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
    .tab,button{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font:inherit}.tab{background:#e2ebe1;color:var(--green);font-weight:700}.tab.active{background:var(--green);color:#fff}
    .panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px #234d2410}
    h2{margin:0 0 14px;color:var(--green);font-size:22px}h3{margin:18px 0 8px;color:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
    details summary{cursor:pointer;color:var(--green)}details summary h2,details summary h3{display:inline-block;margin:0 0 4px}
    .assign-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:22px 0 16px}.assign-tab{border:0;border-bottom:3px solid transparent;background:transparent;color:#68766b;border-radius:0;padding:10px 4px;cursor:pointer;font:inherit;font-weight:700}.assign-tab.active{border-bottom-color:var(--green);color:var(--green)}
    label{display:block;font-weight:700}input,select,textarea{width:100%;padding:9px;border:1px solid #cbd8ca;border-radius:7px;margin-top:4px;font:inherit;background:#fff}textarea{min-height:90px;resize:vertical}
    .checks{border:1px solid #cbd8ca;border-radius:7px;padding:9px;margin-top:4px;min-height:44px}.checks label{display:inline-flex;align-items:center;gap:6px;margin:3px 12px 3px 0;font-weight:400}.checks input{width:auto;margin:0}
    button.primary{background:var(--green);color:#fff}.secondary{background:#e8efe7;color:var(--green)}.danger{background:#fde8e5;color:#a7352a}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--green);background:#f6faf5}
    .muted{color:#68766b}.empty{text-align:center;padding:24px;color:#68766b}.tag{display:inline-block;background:#edf4eb;border-radius:99px;padding:2px 9px;margin:2px;font-size:14px}.trip{border-left:4px solid var(--accent);padding-left:14px;margin:16px 0}.trip img{max-width:180px;max-height:130px;object-fit:cover;border-radius:8px;margin:8px 8px 0 0}
    @media(max-width:650px){table{display:block;overflow-x:auto;white-space:nowrap}.card{padding:15px}}
  </style>
</head>
<body>
  <header><h1>⛺ 露營裝備盤點</h1><p>先知道有什麼，再安排誰來帶，最後留下每次出發的回憶。</p></header>
  <main>
    <nav class="tabs" aria-label="功能選單">
      <button class="tab active" data-tab="people">人員與裝備</button><button class="tab" data-tab="assign">攜帶分配</button><button class="tab" data-tab="shopping">採買與料理</button><button class="tab" data-tab="trips">露營紀錄</button>
    </nav>
    <section id="people" class="panel active">
      <details class="card"><summary><h2>人員管理（新增／修改／刪除）</h2></summary><p class="muted">先在這裡建立同行人員；建立後可直接修改姓名或刪除人員。</p><form id="personForm" class="grid"><label>新增姓名<input id="personName" required placeholder="例如：小明"></label><div class="actions"><button class="primary">新增人員</button></div></form><div id="peopleList"></div></details>
      <div class="card"><h2>登記個人現有裝備</h2><form id="gearForm" class="grid"><label>裝備名稱<input id="gearName" required placeholder="例如：睡袋"></label><label>擁有人<select id="gearOwner" required></select></label><label>數量<input id="gearQty" type="number" min="1" value="1" required></label><label>備註<input id="gearNote" placeholder="尺寸、品牌或狀況"></label><div class="actions"><button class="primary">加入盤點</button></div></form><div id="gearList"></div></div>
    </section>
    <section id="assign" class="panel"><div class="card"><h2>建立出團</h2><form id="outingForm" class="grid"><label>出團日期<input id="outingDate" type="date" required></label><label>地點／縣市<input id="outingLocation" required placeholder="例如：嘉義縣"></label><label>營地名稱<input id="outingPlace" required placeholder="例如：阿里山露營區"></label><label>露營天數<input id="outingDays" type="number" min="1" value="1" required></label><label>是否夜衝<select id="outingNight"><option value="否">否</option><option value="是">是</option></select></label><div class="actions"><button class="primary">新增出團</button></div></form><div id="outingList"></div></div><div class="card"><h2>分配本次出團裝備</h2><p class="muted">請先新增並選擇出團；裝備與人員會直接使用「人員與裝備」的資料。</p><form id="assignForm" class="grid"><label>選擇出團<select id="assignOuting" required></select></label><label>裝備（已登記）<select id="assignGear" required></select></label><label>由誰攜帶<select id="assignPerson" required></select></label><label>數量<input id="assignQty" type="number" min="1" value="1" required></label><div class="actions"><button class="primary">加入分配清單</button><button type="button" class="secondary" id="clearAssign">清空分配</button></div></form><div class="assign-tabs"><button type="button" class="assign-tab active" data-assign-view="upcoming">即將到來</button><button type="button" class="assign-tab" data-assign-view="history">歷史資料</button></div><div id="assignList"></div></div></section>
    <section id="shopping" class="panel"><div class="card"><h2>採買與料理</h2><p class="muted">請先建立出團，再選擇出團維護採買清單與料理安排。</p><label>選擇出團<select id="shoppingOuting" required></select></label><div class="grid" style="margin-top:16px"><form id="shoppingForm"><label>採買品項<input id="shoppingItem" required placeholder="例如：雞蛋"></label><label>數量／備註<input id="shoppingNote" placeholder="例如：2 盒"></label><div class="actions"><button class="primary">加入採買清單</button></div></form><form id="mealForm"><label>餐次<select id="mealType"><option>早餐</option><option>午餐</option><option>晚餐</option><option>宵夜</option><option>其他</option></select></label><label>料理內容<input id="mealName" required placeholder="例如：培根蛋吐司"></label><div class="actions"><button class="primary">加入料理安排</button></div></form></div><div id="shoppingContent"></div></div></section>
    <section id="trips" class="panel"><div class="card"><h2 id="tripFormTitle">新增露營紀錄</h2><form id="tripForm"><div class="grid"><label>露營日期<input id="tripDate" type="date" required></label><label>地點／縣市<input id="tripLocation" required placeholder="例如：嘉義縣"></label>    <label>營地名稱<input id="tripPlace" required placeholder="例如：阿里山露營區"></label><label>露營天數<input id="tripDays" type="number" min="1" value="1" required></label><label>是否夜衝<select id="tripNight"><option value="否">否</option><option value="是">是</option></select></label><div><label>參與人員（可複選）</label><div id="tripParticipants" class="checks"></div></div><label>其他參與人員（選填）<input id="tripOtherParticipants" placeholder="例如：阿凱、小美，以逗號分隔"></label><label>地圖連結（選填）<input id="tripMap" type="url" placeholder="貼上 Google Maps 連結"></label><label>評分（1–5）<input id="tripRating" type="number" min="1" max="5" placeholder="5"></label></div><p class="muted">直接點擊姓名即可勾選；不在清單中的同行者請輸入姓名，多人請用逗號分隔。</p><label style="margin-top:12px">評論與心得<textarea id="tripReview" placeholder="交通、衛浴、景色、下次改進事項…"></textarea></label><label style="margin-top:12px">上傳圖片（可多選）<input id="tripPhotos" type="file" accept="image/*" multiple></label><div class="actions"><button class="primary" id="tripSubmit">儲存紀錄</button><button type="button" class="secondary" id="cancelTripEdit" hidden>取消編輯</button></div></form><hr><div class="grid"><label>關鍵字查詢<input id="tripSearch" placeholder="搜尋地點、營地、日期、參與人員或評論"></label><label>日期排序<select id="tripSort"><option value="desc">最新在前</option><option value="asc">最舊在前</option></select></label></div><div id="tripList"></div></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient=window.supabase.createClient('https://gvivuprejqjqwthfphoq.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2aXZ1cHJlanFqcXd0aGZwaG9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NDMwMjcsImV4cCI6MjEwNTUxOTAyN30.ihLGrs8n9M3LJKSOTldPWv2lKMHzZ031fGvWMubyn-o');
    const key='camping-inventory-v1', defaultData={people:[],gear:[],assign:[],trips:[],outings:[],shopping:[],meals:[]};
    let data=Object.assign({},defaultData,JSON.parse(localStorage.getItem(key)||'{}'));
    const $=id=>document.getElementById(id);
    async function save(){localStorage.setItem(key,JSON.stringify(data));render();const {error}=await supabaseClient.from('app_state').upsert({id:1,data,updated_at:new Date().toISOString()});if(error)alert('雲端同步失敗：'+error.message)}
    async function loadData(){const {data:row,error}=await supabaseClient.from('app_state').select('data').eq('id',1).maybeSingle();if(error){alert('讀取雲端資料失敗，將使用本機資料：'+error.message);render();return}if(row?.data&&Object.keys(row.data).length){data=Object.assign({},defaultData,row.data);localStorage.setItem(key,JSON.stringify(data))}render()}
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function render(){
      $('gearOwner').innerHTML=data.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')||'<option value="">請先新增人員</option>';
      $('assignPerson').innerHTML=data.people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')||'<option value="">請先新增人員</option>';
      $('assignGear').innerHTML=data.gear.map((g,i)=>`<option value="${i}">${esc(g.name)}（${esc(data.people.find(p=>p.id===g.owner)?.name||'未指定')}，現有 ${g.qty}）</option>`).join('')||'<option value="">請先登記裝備</option>';
      $('assignOuting').innerHTML=data.outings.map((o,i)=>`<option value="${i}">${esc(o.location||'未指定地點')}｜${esc(o.place)}｜${esc(o.date)}｜${o.days||1}天｜夜衝：${esc(o.night||'否')}</option>`).join('')||'<option value="">請先新增出團</option>';
      $('shoppingOuting').innerHTML=data.outings.map((o,i)=>`<option value="${i}">${esc(o.location||'未指定地點')}｜${esc(o.place)}｜${esc(o.date)}</option>`).join('')||'<option value="">請先新增出團</option>';
      const selectedOuting=+$('shoppingOuting').value||0,items=data.shopping.filter(x=>x.outing===selectedOuting),meals=data.meals.filter(x=>x.outing===selectedOuting);$('shoppingContent').innerHTML=`<div class="grid"><div><h3>採買清單</h3>${items.length?`<table><tr><th>品項</th><th>數量／備註</th><th></th></tr>${items.map((x,i)=>`<tr><td>${esc(x.item)}</td><td>${esc(x.note)}</td><td><button type="button" class="danger" data-del-shopping="${data.shopping.indexOf(x)}">刪除</button></td></tr>`).join('')}</table>`:'<p class="empty">尚未加入採買品項。</p>'}</div><div><h3>料理安排</h3>${meals.length?`<table><tr><th>餐次</th><th>料理</th><th></th></tr>${meals.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.name)}</td><td><button type="button" class="danger" data-del-meal="${data.meals.indexOf(x)}">刪除</button></td></tr>`).join('')}</table>`:'<p class="empty">尚未加入料理安排。</p>'}</div></div>`;
      $('outingList').innerHTML=data.outings.length?`<h3>已建立出團</h3><div>${data.outings.map((o,i)=>`<span class="tag">${esc(o.location||'未指定地點')}｜${esc(o.place)}｜${esc(o.date)} <button class="danger" data-del-outing="${i}" title="刪除">×</button></span>`).join('')}</div>`:'<p class="empty">尚未建立出團。</p>';
      $('tripParticipants').innerHTML=data.people.map(p=>`<label><input type="checkbox" value="${p.id}"> ${esc(p.name)}</label>`).join('')||'<span class="muted">尚未建立人員，可使用下方自由輸入。</span>';
      $('peopleList').innerHTML=data.people.length?`<h3>已建立人員</h3><table><tr><th>姓名</th><th>操作</th></tr>${data.people.map(p=>`<tr><td><input value="${esc(p.name)}" data-person-name="${p.id}"></td><td><button type="button" class="secondary" data-save-person="${p.id}">修改名稱</button> <button type="button" class="danger" data-del-person="${p.id}">刪除</button></td></tr>`).join('')}</table>`:'<p class="empty">尚未新增人員；請使用上方「新增姓名」欄位建立第一位人員。</p>';
      $('gearList').innerHTML=data.gear.length?`<h3>現有裝備</h3><table><tr><th>裝備</th><th>擁有人</th><th>數量</th><th>備註</th><th></th></tr>${data.gear.map((g,i)=>`<tr><td>${esc(g.name)}</td><td>${esc(data.people.find(p=>p.id===g.owner)?.name||'未指定')}</td><td>${g.qty}</td><td>${esc(g.note)}</td><td><button class="danger" data-del-gear="${i}">刪除</button></td></tr>`).join('')}</table>`:'<p class="empty">尚未登記裝備。</p>';
      const today=new Date().toISOString().slice(0,10),groups={};data.assign.forEach((a,i)=>{const outing=data.outings[a.outing]||{},date=outing.date||a.date||'';if(assignView==='upcoming'&&date<today||assignView==='history'&&date>=today)return;const key=`${outing.location||a.location||'未指定地點'}|${outing.place||a.place||'未指定營地'}|${date||'未指定日期'}|${outing.days||a.days||1}|${outing.night||a.night||'否'}`;(groups[key]??=[]).push({...a,index:i})});$('assignList').innerHTML=Object.keys(groups).length?Object.entries(groups).map(([key,items])=>{const [location,place,date,days,night]=key.split('|');return `<details class="card"><summary><h3>${esc(location)}｜${esc(place)} <span class="muted">｜${esc(date)}｜${esc(days)}天｜夜衝：${esc(night)}</span></h3></summary><table><tr><th>裝備</th><th>攜帶者</th><th>數量</th><th></th></tr>${items.map(a=>`<tr><td>${esc(data.gear[a.gear]?.name||a.name||'未指定')}</td><td>${esc(data.people.find(p=>p.id===a.person)?.name||'未指定')}</td><td>${a.qty}</td><td><button type="button" class="danger" data-del-assign="${a.index}">刪除</button></td></tr>`).join('')}</table></details>`}).join(''):`<p class="empty">${assignView==='upcoming'?'目前沒有即將到來的出團。':'目前沒有歷史出團資料。'}`;
      const query=($('tripSearch')?.value||'').trim().toLowerCase(),sort=$('tripSort')?.value||'desc',filtered=data.trips.map((t,index)=>({...t,index})).filter(t=>!query||JSON.stringify(t).toLowerCase().includes(query)).sort((a,b)=>(a.date||'').localeCompare(b.date||'')*(sort==='asc'?1:-1));            $('tripList').innerHTML=filtered.length?filtered.map(t=>{const names=(t.participants||[]).map(id=>data.people.find(p=>p.id===id)?.name||id).filter(Boolean);return `<article class="trip"><h3>${esc(t.location||'未指定地點')}｜${esc(t.place)} <span class="muted">｜${esc(t.date)}｜${t.days||1}天｜夜衝：${esc(t.night||'否')} ${t.rating?'｜'+t.rating+'／5':''}</span></h3>${names.length?`<p><strong>參與人員：</strong>${names.map(esc).join('、')}</p>`:''}${t.map?`<a href="${esc(t.map)}" target="_blank" rel="noopener">開啟地圖</a>`:''}<p>${esc(t.review).replace(/\n/g,'<br>')}</p>${(t.photos||[]).map(p=>`<img src="${p}" alt="露營照片">`).join('')}<br><button type="button" class="secondary" data-edit-trip="${t.index}">編輯</button> <button type="button" class="danger" data-del-trip="${t.index}">刪除紀錄</button></article>`}).join(''):'<p class="empty">沒有符合條件的露營紀錄。</p>';
    }
    $('personForm').onsubmit=e=>{e.preventDefault();data.people.push({id:crypto.randomUUID(),name:$('personName').value.trim()});e.target.reset();save()};
    $('gearForm').onsubmit=e=>{e.preventDefault();if(!$('gearOwner').value)return alert('請先新增人員');data.gear.push({name:$('gearName').value.trim(),owner:$('gearOwner').value,qty:+$('gearQty').value,note:$('gearNote').value.trim()});e.target.reset();save()};
    $('outingForm').onsubmit=e=>{e.preventDefault();data.outings.push({date:$('outingDate').value,location:$('outingLocation').value.trim(),place:$('outingPlace').value.trim(),days:+$('outingDays').value,night:$('outingNight').value});e.target.reset();save()};
    $('shoppingOuting').onchange=render;$('shoppingForm').onsubmit=e=>{e.preventDefault();if(!$('shoppingOuting').value)return alert('請先建立出團');data.shopping.push({outing:+$('shoppingOuting').value,item:$('shoppingItem').value.trim(),note:$('shoppingNote').value.trim()});e.target.reset();save()};$('mealForm').onsubmit=e=>{e.preventDefault();if(!$('shoppingOuting').value)return alert('請先建立出團');data.meals.push({outing:+$('shoppingOuting').value,type:$('mealType').value,name:$('mealName').value.trim()});e.target.reset();save()};
    $('assignForm').onsubmit=e=>{e.preventDefault();if(!$('assignOuting').value)return alert('請先新增出團');if(!$('assignGear').value)return alert('請先在人員與裝備登記裝備');if(!$('assignPerson').value)return alert('請先新增人員');data.assign.push({outing:+$('assignOuting').value,gear:+$('assignGear').value,person:$('assignPerson').value,qty:+$('assignQty').value});e.target.reset();save()};
    $('clearAssign').onclick=()=>{if(confirm('確定清空本次分配？')){data.assign=[];save()}};
    let assignView='upcoming',editingTrip=-1;$('tripSearch').oninput=render;$('tripSort').onchange=render;$('tripForm').onsubmit=async e=>{e.preventDefault();const files=[...$('tripPhotos').files],photos=await Promise.all(files.map(f=>new Promise(r=>{const reader=new FileReader();reader.onload=()=>r(reader.result);reader.readAsDataURL(f)}))),selected=[...$('tripParticipants').querySelectorAll('input:checked')].map(o=>o.value),others=$('tripOtherParticipants').value.split(/[,，]/).map(n=>n.trim()).filter(Boolean),trip={date:$('tripDate').value,location:$('tripLocation').value.trim(),place:$('tripPlace').value.trim(),days:+$('tripDays').value,night:$('tripNight').value,participants:[...new Set([...selected,...others])],map:$('tripMap').value.trim(),rating:$('tripRating').value,review:$('tripReview').value.trim(),photos:photos.length?photos:(editingTrip>=0?data.trips[editingTrip].photos||[]:[])};if(editingTrip>=0)data.trips[editingTrip]=trip;else data.trips.push(trip);editingTrip=-1;e.target.reset();$('tripFormTitle').textContent='新增露營紀錄';$('tripSubmit').textContent='儲存紀錄';$('cancelTripEdit').hidden=true;save()};
    $('cancelTripEdit').onclick=()=>{editingTrip=-1;$('tripForm').reset();$('tripFormTitle').textContent='新增露營紀錄';$('tripSubmit').textContent='儲存紀錄';$('cancelTripEdit').hidden=true};
    document.addEventListener('click',e=>{const button=e.target.closest('button');const d=button?button.dataset:e.target.dataset;if(d.delShopping){data.shopping.splice(+d.delShopping,1);save()}if(d.delMeal){data.meals.splice(+d.delMeal,1);save()}if(d.assignView){assignView=d.assignView;document.querySelectorAll('[data-assign-view]').forEach(x=>x.classList.toggle('active',x.dataset.assignView===assignView));render()}if(d.editTrip){const t=data.trips[+d.editTrip];editingTrip=+d.editTrip;$('tripDate').value=t.date;$('tripLocation').value=t.location||'';$('tripPlace').value=t.place;$('tripDays').value=t.days||1;$('tripNight').value=t.night||'否';$('tripMap').value=t.map||'';$('tripRating').value=t.rating||'';$('tripReview').value=t.review||'';$('tripOtherParticipants').value=(t.participants||[]).filter(id=>!data.people.some(p=>p.id===id)).join('、');$('tripParticipants').querySelectorAll('input').forEach(x=>x.checked=(t.participants||[]).includes(x.value));$('tripFormTitle').textContent='編輯露營紀錄';$('tripSubmit').textContent='儲存修改';$('cancelTripEdit').hidden=false;document.querySelector('[data-tab="trips"]').click()}if(d.savePerson){const input=document.querySelector(`[data-person-name="${d.savePerson}"]`),name=input?.value.trim();if(!name)return alert('姓名不可空白');data.people.find(p=>p.id===d.savePerson).name=name;save()}if(d.delPerson){if(!confirm('刪除這位人員後，其裝備與攜帶分配也會一併刪除，確定繼續嗎？'))return;data.people=data.people.filter(p=>p.id!==d.delPerson);data.gear=data.gear.filter(g=>g.owner!==d.delPerson);data.assign=data.assign.filter(a=>a.person!==d.delPerson);save()}if(d.delGear){data.gear.splice(+d.delGear,1);save()}if(d.delAssign){data.assign.splice(+d.delAssign,1);save()}if(d.delOuting){const removed=+d.delOuting;data.assign=data.assign.filter(a=>a.outing!==removed).map(a=>a.outing>removed?{...a,outing:a.outing-1}:a);data.outings.splice(removed,1);save()}if(d.delTrip){data.trips.splice(+d.delTrip,1);save()}if(e.target.classList.contains('tab')){document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');$(e.target.dataset.tab).classList.add('active')}});
    loadData();
  </script>
